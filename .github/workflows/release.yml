# A tag v<versionName> becomes a GitHub Release. The build job has no secrets; the publish
# job holds the release key and runs no Gradle, so the key never enters a process that runs
# third-party build code. Tags come from scripts/release.sh.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tag matches versionName
        run: |
          version="$(bash scripts/app-version.sh)"
          if [[ "${GITHUB_REF_NAME#v}" != "$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match versionName $version"
            exit 1
          fi
      - name: Tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - run: bash scripts/ci-checks.sh
      - name: Unsigned release
        run: bash ./gradlew :app:assembleRelease -Psaferec.unsignedRelease=true
      - name: Release inputs
        run: |
          mkdir dist
          cp app/build/outputs/apk/release/app-release-unsigned.apk dist/unsigned.apk
          cp app/build/outputs/mapping/release/mapping.txt dist/mapping.txt
          bash scripts/release-notes.sh "$GITHUB_REF_NAME" > dist/notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-inputs
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      # Only for scripts/check-apk-cert.sh, which runs once the keystore is gone
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-inputs
          path: dist
      - name: Version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Sign
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          umask 077
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$tools/zipalign" -c -P 16 4 dist/unsigned.apk
          "$tools/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-key-alias cert \
            --ks-pass env:RELEASE_STORE_PASSWORD --key-pass env:RELEASE_KEY_PASSWORD \
            --out "SafeRec-$VERSION.apk" dist/unsigned.apk
      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
      - name: Registered certificate
        run: bash scripts/check-apk-cert.sh "SafeRec-$VERSION.apk"
      - name: Checksums
        run: |
          cp dist/mapping.txt "SafeRec-$VERSION-mapping.txt"
          sha256sum "SafeRec-$VERSION.apk" "SafeRec-$VERSION-mapping.txt" > SHA256SUMS
      # A draft until every asset is uploaded: a failed run never leaves a half Release
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --title "SafeRec $VERSION" --notes-file dist/notes.md \
            "SafeRec-$VERSION.apk" "SafeRec-$VERSION-mapping.txt" SHA256SUMS
          gh release edit "$GITHUB_REF_NAME" --draft=false
      - name: Remove a draft left by a failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null)" == true ]]; then
            gh release delete "$GITHUB_REF_NAME" --yes
          fi
